id: registration_4th_ocean_innovatio
title: 'REGISTRATION: 4th Ocean Innovation Challenge: SIDS and LDCs'
description: 'Form where interested parties can register to receive announcements related to Call 4.'
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |-
      <div class="container-fluid" data-bootstrap-contains="containers">
      <div class="container">
      <div class="row">
      <div class="col-12">
      <p>&nbsp;</p>

      <p><img alt="" data-entity-type="file" data-entity-uuid="5d813495-6393-4f51-aac2-d003d9e2e0bf" height="1124" src="/sites/default/files/inline-images/jailam-rashad-Maldives-unsplash%20copy.jpg" width="2000" /></p>

      <h4>&nbsp;</h4>

      <h3><b>Please fill in the short form below to register.</b></h3>

      <h6><b>Your details will only be used for the purpose of this registration and the 4th Ocean Innovation Challenge.</b></h6>
      </div>
      </div>
      </div>
      </div>
      <script src="//cdn.public.n1ed.com/N1D8N1ED/widgets.js"></script>
    '#format': ckeditor
  e_mail_register:
    '#type': email
    '#title': 'E-mail *'
    '#required': true
  title_mr_ms_dr_prof_etc_:
    '#type': textfield
    '#title': 'Title (Mr. / Ms. / Dr. / Prof., etc.)'
  first_name_:
    '#type': textfield
    '#title': 'First Name *'
    '#required': true
  full_name_register:
    '#type': textfield
    '#title': 'Last Name *'
    '#required': true
  position_:
    '#type': textfield
    '#title': 'Job Title'
  organization_register:
    '#type': textfield
    '#title': 'Organization *'
    '#required': true
  type_of_organization_such_as_ngo_startup_sme_etc_:
    '#type': textfield
    '#title': 'Type of organization (such as NGO, Startup, SME, etc.)'
  country:
    '#type': textfield
    '#title': 'Country*'
    '#required': true
  processed_text_02:
    '#type': processed_text
    '#text': |
      <p><strong>My selection(s):</strong></p>
    '#format': ckeditor
  processed_text_03:
    '#type': processed_text
    '#text': |
      <p>Please take note that you will only receive messages related to the UNDP OIC Accelerated Edition (Call 4) to boost SIDS and coastal LDCs’ Blue Economy.</p>

      <p>To subscribe to our quarterly updates, please indicate below.</p>
    '#format': ckeditor
  please_select_your_option_s_:
    '#type': checkboxes
    '#title': 'Opt in to the newsletter'
    '#options':
      'Please subscribe me to the UNDP OIC Updates': 'Please subscribe me to the UNDP OIC Updates'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
