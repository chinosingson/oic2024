  processed_text_02:
    '#type': processed_text
    '#text': |
      <p><strong>My selection(s):</strong></p>
    '#format': ckeditor
  please_select_your_option_s_:
    '#type': checkboxes
    '#title': 'Please select your option(s):'
    '#options':
      'I would like to join the online event.': 'Please send me the Save-the-Date and connection details.'
      'I am interested to join the event but I am not available on this day.': 'I am interested to join the event but I am not available on this day. Please send me more information about AquaInSilico''s Phos Value: Sustainable Solutions for Nutrient Recycling.'
    '#required': true
  any_questions_you_might_have_about_the_topic_:
    '#type': textfield
    '#title': 'Any questions you might have about the topic? Please let us know so we can provide the answers in the webinar.'
    '#counter_type': word
    '#counter_maximum': 200
  processed_text_03:
    '#type': processed_text
    '#text': |
      <p>We will not sign you up to our mailing list. If you are an existing UNDP OIC Quarterly Updates subscriber, signing up to this event will not affect your subscription preferences.</p>
    '#format': ckeditor
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
