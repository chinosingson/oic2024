id: registration_aquainsilico_capsto
title: 'REGISTRATION: AquaInSilico Capstone Event'
description: 'Form where invited participants can confirm their participation for AQUA&#39;s 13 April event.'
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |-
      <div class="container-fluid" data-bootstrap-contains="containers">
      <div class="container">
      <div class="row">
      <div class="col-12">
      <p><img alt="" data-entity-type="file" data-entity-uuid="75cac362-5376-4d18-a11d-8492514b2d27" height="2325" src="/sites/default/files/2023/Phos-ValueMediaCard_V5.png" width="3277" /></p>

      <p><strong>Date:</strong>&nbsp;Thursday, 13 April 2023<br />
      <strong>Time:</strong> <span><span><span><span><span lang="EN-US" xml:lang="EN-US">17:00 Istanbul / 16:00 Central Europe / 15:00 Portugal / 13:00&nbsp; Cape Verde / 10:00 New York</span></span></span></span></span></p>

      <blockquote>
      <p><span><span><span><span><span lang="EN-US" xml:lang="EN-US"><strong>Connect on Zoom:</strong>&nbsp;</span></span></span></span></span><a href="https://undp.zoom.us/j/82073533437">https://undp.zoom.us/j/82073533437</a></p>
      </blockquote>

      <p><em><u><font color="#000000" face="Arial, sans-serif"><span style="font-size: 14.6667px;">*</span></font>The main language for the event is English with live interpretation in Portuguese.</u></em></p>

      <p>&nbsp;</p>

      <p><span><span><span><span><span lang="EN-GB" xml:lang="EN-GB">Cape Verde is a country deeply affected by water scarcity. The increased droughts and sea level rise that is causing the salination of the groundwater will have deep effects in the archipelago’s water reserves. For this reason, the improvement of wastewater treatment is of upmost importance to increase water availability for non-potable applications, such as the irrigation of fields and green spaces, street and car washing, among others.</span></span></span></span></span></p>

      <p><span><span><span><span><span lang="EN-GB" xml:lang="EN-GB">Phos-Value is an innovative project implemented by AquaInSilico, that</span>&nbsp;worked on developing the capacity of<span lang="EN-GB" xml:lang="EN-GB">&nbsp;Cape Verde’s wastewater treatment sector to improve its water quality&nbsp;using&nbsp;AquaInSilico’s pioneering digital intelligence tool - UPWATER<sup>®</sup> - and</span> <span lang="EN-GB" xml:lang="EN-GB">the industry’s best practices. AquaInSilico and its PhosValue project is one of the first cohort of eight innovations selected in 2021 and supported by UNDP, with funding from Sida and Norad, to help accelerate SDG 14 target 1 - Reduce marine pollution.&nbsp;</span></span></span></span></span></p>

      <p><span><span><span><span><span lang="EN-GB" xml:lang="EN-GB">To increase the impact and outreach of the project, a consortium was formed composed of Portuguese and Cape Verdean entities including&nbsp;</span><i><span lang="PT" xml:lang="PT">Agência Nacional de Água e Saneamento</span></i><span lang="PT" xml:lang="PT"> (ANAS), </span><i><span lang="PT" xml:lang="PT">Águas de Santiago</span></i><span lang="PT" xml:lang="PT"> (AdS), Águas</span><i><span lang="PT" xml:lang="PT"> de Portugal</span></i><span lang="PT" xml:lang="PT"> Internacional (AdPI),</span><span lang="PT" xml:lang="PT"> NOVA University of Lisbon and Portuguese Water Partnership (PWP)</span><span lang="EN-US" xml:lang="EN-US">.</span></span></span></span></span></p>

      <p><span><span><span><span><span lang="EN-GB" xml:lang="EN-GB">The two-year implementation of Phos-Value solutions in the pilot wastewater treatment plant in Santa Catarina, Cape Verde </span><b><span lang="EN-GB" xml:lang="EN-GB">enabled a significant reduction of pollutant emissions</span></b><span lang="EN-GB" xml:lang="EN-GB"> to water bodies, preventing eutrophication and contributing to better ocean and human health. Additionally, the project was able to gather insights on how to achieve a </span><b><span lang="EN-GB" xml:lang="EN-GB">circular economy</span></b><span lang="EN-GB" xml:lang="EN-GB"> through the </span><b><span lang="EN-GB" xml:lang="EN-GB">reuse of treated water</span></b><span lang="EN-GB" xml:lang="EN-GB"> and other </span><b><span lang="EN-GB" xml:lang="EN-GB">value-added products</span></b><span lang="EN-GB" xml:lang="EN-GB">, such as </span><b><span lang="EN-GB" xml:lang="EN-GB">biofertilizers</span></b><span lang="EN-GB" xml:lang="EN-GB">, that could be used to </span><b><span lang="EN-GB" xml:lang="EN-GB">promote new revenue streams and business models</span></b><span lang="EN-GB" xml:lang="EN-GB">. Phos-Value deeply focused on capacitating the technical teams, equipment acquisition for laboratory analysis, and control of plant operation. The results achieved so far is beginning to create a positive impact on the social, environmental, and economic sectors in Cape Verde.&nbsp; </span></span></span></span></span></p>

      <p>AquaInSilico is delighted to present, through this capstone event, the results achieved by the implementation of Phos-Value sustainable solutions over these two years in Santa Catarina, Cape Verde, and to help increase awareness on the importance of the wastewater treatment, and promote a circular model in wastewater sector, transforming this into a more sustainable and greener sector.</p>

      <p>&nbsp;</p>

      <p><span><span><span><span><b><span lang="EN-GB" xml:lang="EN-GB"><span>Objectives</span></span></b></span></span></span></span></p>

      <p><span><span><span><span><span lang="EN-GB" xml:lang="EN-GB">The capstone event aims to:</span></span></span></span></span></p>

      <ul>
      	<li><span><span><span><span><span lang="EN-GB" xml:lang="EN-GB">Present the outcomes of the Phos-Value project, the benefits accomplished and its impact on Cape Verdean wastewater sector and economy; &nbsp;</span></span></span></span></span></li>
      	<li><span><span><span><span><span lang="EN-GB" xml:lang="EN-GB">Show the potential of UPWATER<sup>®</sup> in improving the wastewater treatment sector through reduced&nbsp;operational costs and enhanced efficiency, and how this digital tool facilitates the replication of Phos-Value in other wastewater treatment plants;</span></span></span></span></span></li>
      	<li><span><span><span><span><span lang="EN-GB" xml:lang="EN-GB">Clarify how the wastewater treatment sector is a key actor in addressing ocean pollution and water scarcity,&nbsp;and in promoting circular economy. </span></span></span></span></span></li>
      </ul>

      <h4>&nbsp;</h4>

      <h3><b>Please fill in the short form below to register.</b></h3>

      <h6><b>Your details will only be used for the purpose of this registration and event.</b></h6>
      </div>
      </div>
      </div>
      </div>
      <script src="//cdn.public.n1ed.com/N1D8N1ED/widgets.js"></script>
