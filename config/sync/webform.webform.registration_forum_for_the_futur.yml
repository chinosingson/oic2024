id: registration_forum_for_the_futur
title: "REGISTRATION: Forum for the Future's Capstone Event"
description: 'Form where invited participants can confirm their participation for Forum&#39;s 13 February event.'
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |
      <p>&nbsp;<img alt="Forum for the Future Capstone event" data-entity-type="file" data-entity-uuid="6feae8db-e1fd-46b7-8f12-ffa0ba291ac5" src="/sites/default/files/inline-images/reg-image.png" /></p>

      <p><strong>Date:</strong>&nbsp;Monday, 13 February 2023<br />
      <strong>Time:</strong> 2000–2115 Singapore / 1500–1615 Istanbul / 1300-1415 Paris / 0700-0815 New York</p>

      <p>An estimated 35 percent of all plastics in our oceans come from textile microfibres, posing a significant –but not fully understood – impact to human and marine health. While there are consumer solutions that can reduce the amount of microfibres shedding,&nbsp;how can we look upstream at the manufacturing process and truly tackle this problem from end-to-end?</p>

      <p>Forum for the Future and UNDP are delighted to <b>share the findings from the study of microfibre shedding in textile manufacturing processes</b> at this webinar. Together with Forum's project partners Ramatex Group, Nanyang Environment and Water Resources Institute (NEWRI), and Universiti Teknologi Malaysia (UTM), this ocean innovation project, <a href="https://eur03.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.forumforthefuture.org%2Ftackling-microfibres-at-source&amp;data=05%7C01%7Calmary.paigao%40undp.org%7C6ef4598634cf48eec33a08db03771f10%7Cb3e5db5e2944483799f57488ace54319%7C0%7C0%7C638107583522239048%7CUnknown%7CTWFpbGZsb3d8eyJWIjoiMC4wLjAwMDAiLCJQIjoiV2luMzIiLCJBTiI6Ik1haWwiLCJXVCI6Mn0%3D%7C1000%7C%7C%7C&amp;sdata=zE8uNcXLv5hjlWP7vQOu1HvNjClFmmipJOPazZVNgGw%3D&amp;reserved=0" title="https://eur03.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.forumforthefuture.org%2Ftackling-microfibres-at-source&amp;data=05%7C01%7Calmary.paigao%40undp.org%7C6ef4598634cf48eec33a08db03771f10%7Cb3e5db5e2944483799f57488ace54319%7C0%7C0%7C6381075835"><i>Tackling Microfibres at Source</i></a>, set out to understand the impact of various textile manufacturing processes on microfibre shedding, and explore solutions that reduce shedding upstream.&nbsp;</p>

      <p>This capstone event for ocean innovator Forum for the Future aims for participants to:</p>

      <ul>
      	<li>Gain insights into the urgency of the microfibre pollution problem;</li>
      	<li>Learn how it is linked to textile manufacturing through our project’s research methodology and results; and&nbsp;</li>
      	<li>Understand how the textile industry can take action to adopt transformational solutions that lead to long-term meaningful change, that not only reduces microfibre pollution but also shifts the fashion industry to one that is socially just and regenerative for all.</li>
      </ul>

      <p><b>&nbsp;</b></p>

      <p><b>Please fill in the short form below to register.</b></p>

      <h5><b>Your details will only be used for the purpose of this registration and event.</b></h5>
    '#format': ckeditor
  e_mail_register:
