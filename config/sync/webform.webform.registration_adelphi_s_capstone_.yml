id: registration_adelphi_s_capstone_
title: "REGISTRATION: adelphi's Capstone Event"
description: 'Form where invited participants can confirm their participation for adelphi&#39;s August capstone event.'
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |-
      <div class="container-fluid" data-bootstrap-contains="containers">
      <div class="container">
      <div class="row">
      <div class="col-12">
      <p><img alt="adelphi capstone registration" data-entity-type="file" data-entity-uuid="804d221d-ea09-4857-9dd6-f0ba5bfe3e90" src="/sites/default/files/inline-images/adelphi%20-%20registration.png" /></p>

      <p><strong>Date:</strong>&nbsp; Wednesday, 16 August 2023<br />
      <strong>Time:</strong>&nbsp; <span><span><span><span><span lang="EN-US" xml:lang="EN-US">08:00 Central Europe / 11:00 Maldives&nbsp; / 18:00 Fiji</span></span></span></span></span></p>

      <p>&nbsp;</p>

      <p>Every year, the Maldives generates nearly 22,000 tons of plastic waste, and, due to poor waste management practices, as much as a third of it ends up in our coastal areas. With support from the OIC and in cooperation with Zero Waste Maldives, adelphi GmbH helped the Government of the Maldives put in place a national Extended Producer Responsibility (EPR) framework that will help the Maldives to close the loop on plastics wastes to reduce ocean pollution.</p>

      <p>We invite you to join us in an online event on&nbsp;<strong>16 August 2023 (</strong>09:00&nbsp;Istanbul / 08:00 Central Europe / 11:00 Maldives&nbsp; / 18:00 Fiji) to discuss the waste management challenges faced by small island developing states (SIDS) while shedding light on the effectiveness of EPR as an adequate policy solution.</p>

      <p>Drawing from the experiences and lessons learned from the Maldives, adelphi and Zero Waste Maldives will share valuable insights and guidance to empower other SIDS in their efforts to combat plastic pollution and improve waste management practices. One of the key outcomes of the project, the&nbsp;<strong><a href="https://adelphi.de/en/publications/extended-producer-responsibility-implications-on-small-island-developing-states-sids">EPR manual for SIDS</a></strong>, which has been prepared specifically for SIDS countries as a guiding document, will be launched globally for the first time.</p>

      <p>During the event, this manual will be presented, providing practical information on implementing EPR frameworks in SIDS. Experts, practitioners, and stakeholders in the field of waste management will gather at this event in a unique opportunity to gain valuable insights, share experiences, and collectively work towards effective solutions for plastic pollution in SIDS.</p>

      <table aria-rowcount="7" border="1" data-tablelook="1184" data-tablestyle="MsoTableGrid">
      	<tbody>
      		<tr>
      			<td colspan="2" data-celllook="65536" role="rowheader"><strong>Provisional Agenda</strong>&nbsp;(as of 31 July 2023)</td>
      		</tr>
      		<tr aria-rowindex="2" role="row">
      			<td data-celllook="65536" role="rowheader">
      			<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{78}" paraid="293487441">5 minutes&nbsp;</p>
      			</td>
      			<td data-celllook="0">
      			<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{85}" paraid="795958387"><strong>Opening Remarks&nbsp;&nbsp;</strong></p>
      			</td>
      		</tr>
      		<tr aria-rowindex="3" role="row">
      			<td data-celllook="65536" role="rowheader">
      			<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{115}" paraid="419143385">12 minutes&nbsp;</p>
      			</td>
      			<td data-celllook="0">
      			<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{124}" paraid="456438978"><strong>Overview of Waste Management in SIDS&nbsp;&nbsp;</strong></p>

      			<ul role="list">
      				<li aria-setsize="-1" data-aria-level="1" data-aria-posinset="1" data-font="Symbol" data-leveltext="" data-list-defn-props="{&quot;335552541&quot;:1,&quot;335559684&quot;:-2,&quot;335559685&quot;:360,&quot;335559991&quot;:360,&quot;469769226&quot;:&quot;Symbol&quot;,&quot;469769242&quot;:[8226],&quot;469777803&quot;:&quot;left&quot;,&quot;469777804&quot;:&quot;&quot;,&quot;469777815&quot;:&quot;hybridMultilevel&quot;}" data-listid="10" role="listitem">
      				<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{131}" paraid="1136991977">Overview of challenges and unique circumstances faced by SIDS regarding waste management&nbsp;&nbsp;</p>
      				</li>
      				<li aria-setsize="-1" data-aria-level="1" data-aria-posinset="2" data-font="Symbol" data-leveltext="" data-list-defn-props="{&quot;335552541&quot;:1,&quot;335559684&quot;:-2,&quot;335559685&quot;:360,&quot;335559991&quot;:360,&quot;469769226&quot;:&quot;Symbol&quot;,&quot;469769242&quot;:[8226],&quot;469777803&quot;:&quot;left&quot;,&quot;469777804&quot;:&quot;&quot;,&quot;469777815&quot;:&quot;hybridMultilevel&quot;}" data-listid="10" role="listitem">
      				<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{138}" paraid="601925304">Brief discussions on the environmental and socio-economic impacts of improper waste management &nbsp;</p>
      				</li>
      				<li aria-setsize="-1" data-aria-level="1" data-aria-posinset="3" data-font="Symbol" data-leveltext="" data-list-defn-props="{&quot;335552541&quot;:1,&quot;335559684&quot;:-2,&quot;335559685&quot;:360,&quot;335559991&quot;:360,&quot;469769226&quot;:&quot;Symbol&quot;,&quot;469769242&quot;:[8226],&quot;469777803&quot;:&quot;left&quot;,&quot;469777804&quot;:&quot;&quot;,&quot;469777815&quot;:&quot;hybridMultilevel&quot;}" data-listid="10" role="listitem">
      				<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{146}" paraid="134851091">Situation in the Maldives - opportunities, challenges, lessons learnt, during the UNDP OIC incubator&nbsp;&nbsp;</p>
      				</li>
      			</ul>
      			</td>
      		</tr>
      		<tr aria-rowindex="4" role="row">
      			<td data-celllook="65536" role="rowheader">
      			<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{172}" paraid="1546424089">20 minutes&nbsp;</p>
      			</td>
      			<td data-celllook="0">
      			<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{179}" paraid="880450913"><strong>Experts panel on waste management in SIDS&nbsp;</strong>reflecting experience from the&nbsp;Pacific, African and Caribbean SIDS, looking at the country and regional level</p>

      			<ul>
      				<li paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{179}" paraid="880450913">Chris Corbin, Programme Manager for the Assessment and Management of Environmental Pollution (AMEP) Sub-Programme, UNEP Caribbean Environment Programme</li>
      				<li paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{179}" paraid="880450913">Yuvan Beejadhur, Senior Adviser to the Director General of the World Trade Organization</li>
      				<li paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{179}" paraid="880450913">Speaker from the Pacific (To be confirmed)</li>
      			</ul>
      			</td>
      		</tr>
      		<tr aria-rowindex="5" role="row">
      			<td data-celllook="65536" role="rowheader">
      			<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{202}" paraid="1571528052">10 minutes&nbsp;</p>
      			</td>
      			<td data-celllook="0">
      			<p paraeid="{a25b98c9-fffe-40fb-a566-13053cd41baa}{209}" paraid="330853116"><strong>Presentation of EPR manual developed as guiding document for stakeholders in SIDS&nbsp;</strong></p>
      			</td>
      		</tr>
      		<tr aria-rowindex="6" role="row">
      			<td data-celllook="65536" role="rowheader">
      			<p paraeid="{ea6c0722-7632-4ddb-9e58-1a98dc3b3933}{4}" paraid="1068093205">10 minutes&nbsp;&nbsp;</p>
      			</td>
      			<td data-celllook="0">
      			<p paraeid="{ea6c0722-7632-4ddb-9e58-1a98dc3b3933}{15}" paraid="1995797408"><strong>Q&amp;A</strong></p>
      			</td>
      		</tr>
      		<tr aria-rowindex="7" role="row">
      			<td data-celllook="65536" role="rowheader">
      			<p paraeid="{ea6c0722-7632-4ddb-9e58-1a98dc3b3933}{34}" paraid="1622026479">3 minutes&nbsp;&nbsp;</p>
      			</td>
      			<td data-celllook="0">
      			<p paraeid="{ea6c0722-7632-4ddb-9e58-1a98dc3b3933}{43}" paraid="342179496"><strong>Closing remarks</strong>&nbsp;</p>
      			</td>
      		</tr>
      	</tbody>
      </table>

      <p>&nbsp;</p>

      <h4>&nbsp;</h4>

      <h3><b>Please fill in the short form below to register.</b></h3>

      <h6><b>Your details will only be used for the purpose of this registration and event.</b></h6>
      </div>
      </div>
      </div>
      </div>
