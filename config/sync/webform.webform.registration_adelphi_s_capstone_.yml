      body: "<p>Dear&nbsp;[webform_submission:values:first_name_],<br />\r\n<br />\r\nThank you for your interest in UNDP Ocean Innovator adelphi and their online capstone event&nbsp;<strong><em>Extended Producer Responsibility (EPR): A &lsquo;plastic waste management&rsquo; policy solution for SIDS, with lessons learnt from EPR Maldives</em></strong><em>.</em> Click <a href=\"https://oceaninnovationchallenge.org/ocean-innovators#cbp=/ocean-innovations/developing-epr-scheme-plastic-and-packaging-waste-maldives\">here</a> to know more about their work, or visit them at <a href=\"https://adelphi.de\">https://adelphi.de</a>.&nbsp;<br />\r\n<br />\r\nKindly refer to the below information for the connection details of the capstone event:</p>\r\n\r\n<ul>\r\n\t<li><strong>Event Title</strong>: Extended Producer Responsibility (EPR) as a policy &lsquo;plastic waste management&rsquo; solution for SIDS, with lessons learnt from EPR Maldives - A Capstone Event</li>\r\n\t<li><strong>Date:</strong>&nbsp;Wednesday, 16&nbsp;August 2023</li>\r\n\t<li><strong>Time:</strong>&nbsp;09:00 Istanbul / 08:00 Central European / 18:00 Fiji / 11:00 Maldives</li>\r\n\t<li><strong>Zoom Link</strong>:&nbsp;https://undp.zoom.us/j/81229730990&nbsp;</li>\r\n</ul>\r\nWe will send a calendar invite and reminder closer to the event.\r\n\r\n<p>Visit us at <strong><a href=\"https://oceaninnovationchallenge.org\">https://oceaninnovationchallenge.org</a></strong> to know more about the&nbsp;Ocean Innovation Challenge&nbsp;(OIC) and innovators, and the ongoing <a href=\"https://bit.ly/UNDPOICCoh4\"><strong>4th Call for Proposals</strong></a> on SIDS and coastal least developed countries (LDCs) Blue Economy.<br />\r\n&nbsp;</p>\r\n\r\n<p>Best regards,<br />\r\nUNDP OIC Secretariat</p>"
