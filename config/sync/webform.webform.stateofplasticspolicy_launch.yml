id: stateofplasticspolicy_launch
title: 'Registration for the launch of the State of Plastics Policy Report'
description: 'Form where invited participants can confirm their participation for the 23 February launch by Duke University Nicholas Institute of Environmental Policy Solutions'
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |
      <p>To register for the launch of the annual State of the Plastics Policy Report, please provide the following details below.</p>

      <p>Kindly take note that your details will only be used for the purpose of this event unless otherwise indicated.</p>
    '#format': ckeditor
  e_mail_register:
    '#type': email
    '#title': 'E-mail *'
    '#required': true
  title_mr_ms_dr_prof_etc_:
    '#type': textfield
    '#title': 'Title (Mr. / Ms. / Dr. / Prof., etc.)'
  first_name_:
    '#type': textfield
    '#title': 'First Name *'
    '#required': true
  full_name_register:
    '#type': textfield
    '#title': 'Last Name *'
    '#required': true
  organization_register:
    '#type': textfield
    '#title': 'Organization *'
    '#required': true
  position_:
    '#type': textfield
    '#title': 'Position *'
    '#required': true
  please_select_your_preferred_language_for_the_event_:
    '#type': label
    '#title': 'Please select your preferred language for the event *:'
  select_event_language:
    '#type': checkboxes
    '#title': 'Please select your preferred language for the event:'
    '#multiple': 2
    '#description': 'English is the main language of the event. We are considering offering simultaneous translation in French and Spanish. If you prefer translation, please indicate the language:'
    '#options':
      French: French
      Spanish: Spanish
      English: English
    '#options_display': side_by_side
    '#required': true
  do_you_want_to_know_more_about_the_undp_ocean_innovation_challen:
    '#type': checkbox
    '#title': 'I am interested to know more about the UNDP Ocean Innovation Challenge.'
    '#description': 'Please provide me further information about the UNDP OIC, its activities, and any opportunities.&nbsp;'
    '#title_display': before
    '#prepopulate': true
    '#icheck': minimal-grey
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
