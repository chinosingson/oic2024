id: registration_triple_win_approach
title: 'REGISTRATION: Ficosterra’s Nutrialgae: A Triple Win Ocean Solution to Nutrient Pollution- A Capstone Event'
description: 'Form where invited participants can confirm their participation for Ficosterra&#39;s 16 November event.'
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |
      <p><img alt="Ficosterra 2022 poster" data-entity-type="file" data-entity-uuid="b77263d9-9e7f-4595-a105-9ed560896732" src="/sites/default/files/inline-images/fico-poster-short.png" /></p>

      <p>To <strong>join the live event</strong> <strong>or</strong> to <strong>request for further information</strong> on Ficosterra's Triple Win Approach, please fill in the short form below.</p>

      <p>Your details will only be used for the purpose of this registration and event.</p>

      <p><!--<p>Please provide the following details to proceed with the application. After clicking SUBMIT, you will receive an email with the link to the online application form.</p>--></p>
    '#format': ckeditor
  e_mail_register:
    '#type': email
    '#title': 'E-mail *'
    '#required': true
  title_mr_ms_dr_prof_etc_:
    '#type': textfield
    '#title': 'Title (Mr. / Ms. / Dr. / Prof., etc.)'
  first_name_:
    '#type': textfield
    '#title': 'First Name *'
    '#required': true
  full_name_register:
    '#type': textfield
    '#title': 'Last Name *'
    '#required': true
  organization_register:
    '#type': textfield
    '#title': 'Organization *'
    '#required': true
  position_:
    '#type': textfield
    '#title': 'Job Title'
  processed_text_02:
    '#type': processed_text
    '#text': |
      <p><strong>I will participate:</strong></p>
    '#format': ckeditor
  please_select_your_option_s_:
    '#type': checkboxes
    '#title': 'Please select your option(s):'
    '#options':
      'I would like to join the online event.': 'Please send me the Save-the-Date and connection details.'
      'I am interested to join the event but I am not available on this day.': 'I am interested to join the event but I am not available on this day. Please send me more information about Ficosterra''s Triple Win Approach.'
      'I am interested to receive more information about Ficosterra''s Triple Win Approach.': 'I am interested to receive more information about Ficosterra''s Triple Win Approach.'
    '#required': true
  processed_text_03:
    '#type': processed_text
    '#text': |
      <h5>We will not sign you up to our mailing list.</h5>

      <h5>If you are an existing UNDP OIC Quarterly Updates subscriber, signing up to this event will not affect your subscription preferences.</h5>
    '#format': ckeditor
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
