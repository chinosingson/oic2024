id: registration_for_undp_events_at_
title: 'Registration: UNDP signature event at the UN Water Conference 2023'
description: "Form where invited participants can confirm their participation for the UN 2023 Water Conference UNDP signature event event.<br />\r\nThis form will be used to send updates to interested participants.<br />\r\n&nbsp;"
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |-
      <div class="container-fluid" data-bootstrap-contains="containers">
      <div class="container">
      <div class="row">
      <div class="col-12">
      <p><img alt="UNDP side event at the UN Water Conference" data-align="left" data-entity-type="file" data-entity-uuid="829d5bd0-4021-4e66-ae0e-2f279aea9385" src="/sites/default/files/inline-images/side-event%20lt%20blue%20signature%20WEB%20final.png"></p>

      <p>&nbsp;</p>

      <p>Taking a whole of SDG approach, UNDP together with governments and partners across the world, from local to national, regional to global, tests and delivers solutions in inclusive water resources management for upscaling and replication.  &nbsp;</p>

      <p>Our work on integrated water management is anchored in three pillars of: (1) water access, (2) water security, and (3) water quality. To improve development around these issues, our work features cross cutting approaches, including: institutional support and governance; sustainable capacity development; data and information management; water economics and valuation; finance for water management; and, innovation and nature based solutions. &nbsp;</p>

      <p>These solutions address on-the-ground needs and have high potential for upscaling and replication. Examples presented cover nature-based solutions and innovative approaches that have demonstrated results, tailor-fit to specific development needs, and strengthened by expert guidance on financial resource mobilization and capacity development.  &nbsp;</p>

      <p>This side event will showcase commitments and present innovative tested solutions to the Water Action Agenda, to meet water challenges exacerbated by climate change and affecting freshwater ecosystems, and to accelerate sustainable development for all, leaving no one behind. &nbsp;</p>

      <p>The main language for the event is English with interpretation in French and Spanish. Interpretation available for the live event for in-venue participants only.</p>

      <p><strong>To watch the event live on UN Web TV</strong>:&nbsp;<a href="https://media.un.org/en/asset/k1h/k1h1qvr9rg">https://media.un.org/en/asset/k1h/k1h1qvr9rg</a></p>

      <p><strong>OBJECTIVES</strong>&nbsp;</p>

      <p>This high-level event aims to: &nbsp;</p>

      <ul>
      	<li>Reinforce cooperation to increase water access, strengthen water security, and improve water quality for all;&nbsp;</li>
      	<li>Share replicable and scalable solutions through cross cutting approaches and best practices;&nbsp;</li>
      	<li>Inspire new commitments, partnerships and investments to support integrated water management and innovative approaches and solutions at all levels; and</li>
      	<li>Launch exciting inclusive knowledge management platforms for a Water Secure World.</li>
      </ul>

      <p><strong>AGENDA&nbsp;</strong><em>&nbsp;</em></p>

      <p><strong>I. Welcome remarks and keynote address</strong> (3 mins): Usha Rao-Monari, Associate Administrator, UNDP&nbsp;</p>

      <p><strong>II. High-level panel discussion</strong> (30 mins):&nbsp; Distinguished leaders on water management&nbsp;</p>

      <ul>
      	<li><strong>H.E. Sandra Vilardy</strong>, Viceministra de Políticas y Normalización Ambiental, Colombia</li>
      	<li><strong>H.E. Amatlain E. Kabua</strong>, Ambassador &amp; Permanent Representative of the&nbsp;Republic of the Marshall Islands to the United Nations</li>
      	<li><strong>H.E. Josephine Napwon</strong>, Minister of Environment, South Sudan</li>
      	<li><strong>H.E. Daniel Westlén</strong>, Vice-minister for Climate and the Environment, Sweden</li>
      </ul>

      <p><strong>III. What is your aqua challenge? We've got solutions!&nbsp;</strong>(30 mins)</p>

      <p>This segment will showcase solutions addressing on-the-ground needs and have high potential for replication and upscaling, and can be customized based on unique, individual needs. They include nature-based solutions and innovative approaches that have demonstrated results and strengthened by expert guidance on financial resource mobilization and capacity development. Presenters will highlight concrete results and impacts emerging from these solutions.</p>

      <p><strong>Segment moderator</strong>: Shomy Chowdhury, Generation17 young leader and WASH advocate&nbsp;<br>
      &nbsp;</p>

      <p><strong>1.&nbsp;&nbsp; &nbsp;Inclusive knowledge management for a Water Secure World</strong><br>
      Presenter: <strong>Jaehyang So</strong>, GWPTEC Chair, Global Water Partnership&nbsp;<br>
      <strong>2.&nbsp;&nbsp; &nbsp;Transboundary waters management cooperation, integrated water resource management approaches and tools, and a global knowledge platform</strong><br>
      Presenter(s): &nbsp;<strong>Astrid Hillers</strong>, Sr. Environmental Specialist and Program Manager of the International Waters portfolio at the Global Environment Facility&nbsp;<br>
      <strong>Birgit Vogel</strong>, International Commission on the Protection of the Danube River (ICPDR)<br>
      <strong>3.&nbsp;&nbsp; &nbsp;Private sector partnerships on water for development&nbsp;</strong><br>
      Presenter: <strong>Henri Bruxelles</strong>, Executive Vice President and Global Head of Sustainability and Strategic Business Development, Danone<br>
      &nbsp;</p>

      <p><strong>IV. Wrap up and closing</strong></p>

      <p><strong>Program Moderator: Mary Matthews</strong>, Senior Technical Advisor Water &amp; Ocean a.i. and Ocean Advisor &amp; Ocean Innovation Challenge Manager, UNDP</p>

      <p>&nbsp;</p>

      <p>Please take note of the following:</p>

      <ul>
      	<li>UNDP and any of its partner organizers do&nbsp;not provide visa application and travel support.</li>
      	<li>Only participants registered for the UN Water Conference may attend the onsite events within UNHQ.</li>
      	<li>Seats are on a first come-first serve basis.</li>
      	<li>UN Web TV coverage is available for virtual participation.</li>
      </ul>

      <p>We will get in touch with you shortly with more details and updates on this event.</p>
      </div>
      </div>
      </div>
      </div><script src="//cdn.public.n1ed.com/N1D8N1ED/widgets.js"></script>
