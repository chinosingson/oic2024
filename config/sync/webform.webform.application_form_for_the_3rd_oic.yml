id: application_form_for_the_3rd_oic
title: 'Application Form - 3rd OIC Call'
description: ''
categories: {  }
elements: |-
  divider_2:
    '#type': processed_text
    '#text': '<div class="c-content-divider c-icon-bg"> <i class="icon-drop c-rounded c-font-white"></i> </div>'
    '#format': html
  project_information_section:
    '#type': webform_section
    '#title': 'About the Innovation'
    '#attributes':
      class:
        - section-spacing-bottom-small
    project_title:
      '#type': textfield
      '#title': 'Innovation Title *'
      '#required': true
    project_category:
      '#type': webform_checkboxes_other
      '#title': 'Category* (You may select more than one)'
      '#options':
        'Marine Protected Areas': 'Marine Protected Areas'
        'Marine Spatial Planning/Integrated Coastal Management': 'Marine Spatial Planning/Integrated Coastal Management'
        'Ocean Data': 'Ocean Data'
        'Large Marine Ecosystems': 'Large Marine Ecosystems'
        'Blue Carbon': 'Blue Carbon'
        'Blue Economy': 'Blue Economy'
      '#options_display': two_columns
      '#other__option_label': 'Others. Please specify here: '
      '#required': true
    project_time_frame_12_24_months_:
      '#type': textfield
      '#title': 'Time frame (12 - 24 months) *'
      '#required': true
    oic_budget_request_50_000_usd_250_000_usd_:
      '#type': textfield
      '#title': 'OIC Budget Request (50,000 USD - 250,000 USD) *'
      '#required': true
    co_financing_provided_by_proponent_usd_:
      '#type': textfield
      '#title': 'Co-financing provided by proponent (USD)'
    beneficiary_countries:
      '#type': label
      '#title': 'Beneficiary Countries * Type the first three letters to get suggestions. Only developing countries qualify as beneficiary country/ies. ''Global'' and ''Regional'' are included in the list.'
      '#description': 'Type the first few letters to get suggestions. Only least develop countries qualify as beneficiary country/ies.'
    container:
      '#type': container
      '#attributes':
        class:
          - row
      country_1_beneficiary_search:
        '#type': webform_autocomplete
        '#title': 'Country 1: *'
        '#prepopulate': true
        '#required': true
        '#wrapper_attributes':
          class:
            - 'col-md-6 col-sm-12'
        '#attributes':
          class:
            - 'form-control input-lg'
        '#autocomplete_items': beneficiary_countries_custom_lis
      country_2_:
        '#type': webform_autocomplete
        '#title': 'Country 2:'
        '#prepopulate': true
        '#wrapper_attributes':
          class:
            - 'col-md-6 col-sm-12'
        '#attributes':
          class:
            - 'form-control input-lg'
        '#autocomplete_items': beneficiary_countries_custom_lis
      country_3_:
        '#type': webform_autocomplete
        '#title': 'Country 3:'
        '#prepopulate': true
        '#wrapper_attributes':
          class:
            - 'col-md-6 col-sm-12'
        '#attributes':
          class:
            - 'form-control input-lg'
        '#autocomplete_items': beneficiary_countries_custom_lis
      country_4_beneficiary:
        '#type': webform_autocomplete
        '#title': 'Country 4:'
        '#prepopulate': true
        '#wrapper_attributes':
          class:
            - 'col-md-6 col-sm-12'
        '#attributes':
          class:
            - 'form-control input-lg'
        '#autocomplete_items': beneficiary_countries_custom_lis
      country_5_beneficiary:
        '#type': webform_autocomplete
        '#title': 'Country 5:'
        '#prepopulate': true
        '#wrapper_attributes':
          class:
            - 'col-md-6 col-sm-12'
        '#attributes':
          class:
            - 'form-control input-lg'
        '#autocomplete_items': beneficiary_countries_custom_lis
      country_6_beneficiary:
        '#type': webform_autocomplete
        '#title': 'Country 6:'
        '#prepopulate': true
        '#wrapper_attributes':
          class:
            - 'col-md-6 col-sm-12'
        '#attributes':
          class:
            - 'form-control input-lg'
        '#autocomplete_items': beneficiary_countries_custom_lis
    brief_description_of_project_up_to_500_words_:
      '#type': textarea
      '#title': 'Description of innovation (up to 500 words)  *'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 500
    describe_how_project_address_sustainable_fisheries:
      '#type': textarea
      '#title': 'Describe specifically how the innovation will address Sustainable Fisheries - SDGs 14.2, 14.5, 14.7 (250 words) *'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 250
    describe_how_project_innovative_appropriate:
      '#type': textarea
      '#title': 'Innovativeness/Transformational (250 words) * '
      '#placeholder': 'Describe how it is innovative and, as appropriate, potentially transformational (250 words)'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 250
    describe_how_project_sustained_after_initial_grant:
      '#type': textarea
      '#title': 'Sustainability (250 words) * '
      '#placeholder': 'Briefly describe how the innovation would be sustained after the initial OIC support'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 250
    explain_how_project_demonstrated_replicated_scaled_up:
      '#type': textarea
      '#title': 'Replicability & Upscaling (250 words) * '
      '#placeholder': 'Explain how the innovation, once demonstrated, could be replicated and scaled up '
      '#required': true
      '#counter_type': word
      '#counter_maximum': 250
    list_key_project_stakeholders_brief_description_roles:
      '#type': textarea
      '#title': 'List key stakeholders and brief description of their roles (150 words) *'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 150
    briefly_describe_project_management_arrangements:
      '#type': textarea
      '#title': 'Briefly describe how the innovation will be managed (150 words) *'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 150
    briefly_describe_how_project_could_impact_poverty_reduction:
      '#type': textarea
      '#title': 'Briefly describe how the innovation will impact poverty reduction and livelihoods creation (150 words) *'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 150
    briefly_describe_how_your_innovation_will_support_gender_mainstr:
      '#type': textarea
      '#title': 'Briefly describe how your innovation will support gender mainstreaming, including benefits to women and girls, either directly or indirectly (150 words) *'
      '#required': true
      '#counter_type': word
      '#counter_maximum': 150
  divider_1:
    '#type': processed_text
    '#text': '<div class="c-content-divider c-icon-bg"> <i class="icon-drop c-rounded c-font-white"></i> </div>'
    '#format': html
  project_proponent_organization_section:
    '#type': webform_section
    '#title': 'Project Proponent Organization '
    '#attributes':
      class:
        - section-spacing-top-small
    name_project_proponent_organization:
      '#type': textfield
      '#title': 'Name of proponent organization *'
      '#required': true
    _location_country:
      '#type': label
      '#title': 'Proponent Country  (may be in either developing or developed countries) :*'
    country_all_countries_listed_:
      '#type': webform_autocomplete
      '#title': 'Type the first three letters to get suggestions.'
      '#prepopulate': true
      '#required': true
      '#attributes':
        class:
          - 'form-control input-lg'
      '#autocomplete_items': countries_undp
    address_street_city_state_province_postal_code:
      '#type': textarea
      '#title': 'Address (street, city, state/province, postal code) *'
      '#rows': 2
      '#placeholder': 'Address (street, city, state/province, postal code)'
      '#autocomplete': ''
      '#required': true
    name_of_individual_test_:
      '#type': webform_name
      '#title': 'Name of individual submitting proposal on behalf of the organization*'
      '#title_display': before
      '#required': true
      '#title__access': false
      '#first__title_display': inline
      '#first__required': true
      '#middle__access': false
      '#last__title_display': inline
      '#last__required': true
      '#suffix__access': false
      '#suffix__title_display': inline
      '#degree__access': false
    title_e_g_project_manager_technical_advisor_proprietor_etc_:
      '#type': textfield
      '#title': 'Title (e.g., Project Manager, Technical Advisor, Proprietor, etc.) *'
      '#required': true
    website:
      '#type': url
      '#title': Website
      '#title_display': inline
    e_mail:
      '#type': email
      '#title': 'E-mail *'
      '#required': true
    telephone:
      '#type': textfield
      '#title': 'Telephone/Mobile Number'
    project_partners:
      '#type': textfield
      '#title': 'Project partners (if any)'
      '#multiple': 20
    type_of_organization:
      '#type': radios
      '#title': 'Type of Organization *'
      '#title_display': before
      '#options':
        'Government agency': Government
        NGO: NGO
        'Private sector': 'Private sector'
        Academia: Academia
        UN: UN
        'Intergovernmental organizations': 'Intergovernmental organizations'
      '#options_display': two_columns
      '#required': true
  agree_get_updates:
    '#type': webform_terms_of_service
    '#title': 'I would like to get updates in the future by subscribing to the UNDP OIC updates (you may unsubscribe at anytime).'
    '#required': true
    '#terms_title': 'Terms title'
    '#terms_content': 'Terms content'
  _indicate_required_fields_and_must_be_completed_:
    '#type': label
    '#title': '* indicate required fields and must be completed.'
    '#attributes':
      class:
        - required-fields-text
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
  for_additional_info:
    '#type': processed_text
    '#wrapper_attributes':
      class:
        - for-additional-inquiries-border-left
    '#display_on': both
    '#text': |
      <div class="c-content-title-3 c-border-green c-left c-title">
            <h4 class="c-left c-font ">Contact us by email (oic.info@undp.org) for any problems or questions.</h4>

            <h4 class="c-left c-font ">Please add the OIC email (oic.info@undp.org) to your 'Safe senders list' or address book to make sure you are able to receive upcoming updates and future communications from us.</h4>
      </div>
    '#format': html
css: "#edit-project-category > legend,\r\n#edit-type-of-organization--wrapper-legend,\r\n#edit-name-of-individual-test---wrapper > legend{\r\n  margin-bottom: 0 !important;\r\n  display: inline !important;\r\n  font-size: 16px !important;\r\n  border-bottom: 0 !important;\r\n}\r\n\r\n#edit-type-of-organization > div > div {\r\n    display: inline;\r\n}\r\n\r\n#edit-project-proponent-organization-section > div > div.webform-element--title-inline.form-group.js-form-item.form-item.js-form-type-url.form-item-website.js-form-item-website > div {\r\n  display: inline;\r\n}"
