id: registration_for_plastics_and_ma
title: 'Registration for "Plastics and marine pollution: Innovations for SDG 14" side event at the UN Ocean Conference 2022'
description: "Form where invited participants can confirm their participation for the 8 June high-level event.<br />\r\nThis form will be submitted to Intrado for sending of the event link.<br />\r\n&nbsp;"
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |
      <h2>&nbsp;Plastics and marine pollution: Innovations for SDG 14.1</h2>

      <p>A side event of the 2022 UN Ocean Conference</p>

      <p>Co-organized by:</p>

      <p><a href="https://undp.org"><img alt="UNDP" data-entity-type="file" data-entity-uuid="aeaa1c5c-22cc-4330-9d9b-bddfcf3a8536" src="/sites/default/files/inline-images/1-undp.png" /></a><a href="https://unosd.un.org/"><img alt="UNOSD" data-entity-type="file" data-entity-uuid="48174de1-9666-42de-9475-fb82dab45e91" src="/sites/default/files/inline-images/2-unosd.png" /></a><a href="https://www.mof.go.kr/en/index.do"><img alt="MOF-ROK" data-entity-type="file" data-entity-uuid="f999e7db-c40c-45c4-924d-252b9d63d6f0" src="/sites/default/files/inline-images/3-mof-rok.png" /></a></p>

      <p>Please provide the following details below. Your details will only be used for the purpose of this registration and event.</p>

      <p>By signing up, you will get the latest update on the programme, connection details (for virtual participants) and other exciting details. <strong>This does not guarantee a seat for in-person participants</strong>, who will receive an&nbsp;e-mail reminder to proceed promptly to the event venue an hour before the event.</p>

      <p><strong>Kindly take note that the co-organizers will not be able to provide sponsorship for in-person participation in Lisbon.</strong></p>
    '#format': ckeditor
  e_mail_register:
    '#type': email
    '#title': 'E-mail *'
    '#required': true
  title_mr_ms_dr_prof_etc_:
    '#type': textfield
    '#title': 'Title (Mr. / Ms. / Dr. / Prof., etc.)'
  first_name_:
    '#type': textfield
    '#title': 'First Name *'
    '#required': true
  full_name_register:
    '#type': textfield
    '#title': 'Last Name *'
    '#required': true
  organization_register:
    '#type': textfield
    '#title': 'Organization *'
    '#required': true
  position_:
    '#type': textfield
    '#title': 'Job Title *'
    '#required': true
  processed_text_02:
    '#type': processed_text
    '#text': |
      <p><strong>I will participate:</strong></p>
    '#format': ckeditor
  i_will_be_participating:
    '#type': checkboxes
    '#title': 'I will be participating'
    '#options':
      'in person in Lisbon': 'in person in Lisbon'
      online: online
    '#required': true
  processed_text_01:
    '#type': processed_text
    '#text': |
      <p>We will contact you soon with more information on this event including the connection link (for those participating via the live stream).</p>
    '#format': ckeditor
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
