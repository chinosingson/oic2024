id: registration_for_undp_side_event
title: 'Registration for UNDP side events at the UN Ocean Conference 2022'
description: "Form where invited participants can confirm their participation for the 8 June high-level event.<br />\r\nThis form will be submitted to Intrado for sending of the event link.<br />\r\n&nbsp;"
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |-
      <div class="container-fluid" data-bootstrap-contains="containers">
      <div class="container">
      <div class="row">
      <div class="col-12">
      <p>To register for&nbsp;UNDP side events at the UN Ocean Conference 2022, please provide the following details below.</p>

      <p>Your details will only be used for the purpose of this registration.</p>
      </div>
      </div>
      </div>
      </div>
      <script src="//cdn.public.n1ed.com/N1D8N1ED/widgets.js"></script>
    '#format': ckeditor
  e_mail_register:
    '#type': email
    '#title': 'E-mail *'
    '#required': true
  title_mr_ms_dr_prof_etc_:
    '#type': textfield
    '#title': 'Title (Mr. / Ms. / Dr. / Prof., etc.)'
  first_name_:
    '#type': textfield
    '#title': 'First Name *'
    '#required': true
  full_name_register:
    '#type': textfield
    '#title': 'Last Name *'
    '#required': true
  organization_register:
    '#type': textfield
    '#title': 'Organization *'
    '#required': true
  position_:
    '#type': textfield
    '#title': 'Job Title *'
    '#required': true
  processed_text:
    '#type': processed_text
    '#text': |
      <p><strong>PLEASE SELECT THE SIDE EVENT(S)</strong></p>
    '#format': ckeditor
  processed_text_01:
    '#type': processed_text
    '#text': |
      <p><strong>In-person events for those who will be in Lisbon:</strong></p>
    '#format': ckeditor
  sideevent:
    '#type': checkboxes
    '#title': 'In-person events for those who will be in Lisbon'
    '#options':
      'Thematic Debt—Accelerating the Blue Economy ': |
        Thematic Debt—Accelerating the Blue Economy  -- 28 June 
        10:00-11:15 UTC +1
      'Global partnerships: Strengthening SDG 14 efforts in the shipping and fisheries sectors through a science-based, multi-tiered approach ': |
        Global partnerships: Strengthening SDG 14 efforts in the shipping and fisheries sectors through a science-based, multi-tiered approach  -- 28 June
        14:30-15:45 UTC  +1
        Altice Arena, Lisbon
      'Large Marine Ecosystems Approach:     The Essential Management and Partnership Tool Helping Countries Achieve SDG14 Targets ': |
        Large Marine Ecosystems Approach:     The Essential Management and Partnership Tool Helping Countries Achieve SDG14 Targets  -- 29 June 
        14:30 – 15:45 UTC +1,
        Altice Arena, Lisbon 
      'Plastics and marine pollution: innovations for SGD 14.1': |
        Plastics and marine pollution: innovations for SGD 14.1 -- 29 June (with LIVE STREAM)
        16:00-17:15 UTC +1
        Committee Room, Altice Arena, Lisbon 
      'Innovating Marine Biodiversity Credits': |
        Innovating Marine Biodiversity Credits -- 30 June
        13.00-13.45 UTC +1
        Reef Action Hub, Lisbon
      'Coral Reef-positive Business Models: A Blended Finance Pipeline for the Global Fund for Coral Reefs': |
        Coral Reef-positive Business Models: A Blended Finance Pipeline for the Global Fund for Coral Reefs -- 30 June  
        14:00-15:15 UTC +1
        Reef Action Hub, Lisbon
      'Starting at the Source to Save the Sea: Coordinated Action to Achieve SDG 14': |-
        Starting at the Source to Save the Sea: Coordinated Action to Achieve SDG 14 -- 30 June  
        14:30-15:45 UTC +1
        Altice Arena, Lisbon
  processed_text_02:
    '#type': processed_text
    '#text': |
      <p><strong>Virtual events:</strong></p>
    '#format': ckeditor
  online_events:
    '#type': checkboxes
    '#title': 'Online events'
    '#options':
      'Plastics and Circular Economy—Community to Cabinet in Action ': |
        Plastics and Circular Economy—Community to Cabinet in Action  -- 27 June  
        14:30-15:45 UTC +1  
      'International and Caribbean Efforts to Address Organized Crime in the Fishing Industry': |
        International and Caribbean Efforts to Address Organized Crime in the Fishing Industry -- 29 June (Live stream from a By-Invitation in-person event)
        15:45 – 17:15 UTC +1,
        Pavilhão de Portugal (directly outside of Altice Arena), Lisbon 
      'Plastics and marine pollution: innovations for SGD 14.1': |-
        Plastics and marine pollution: innovations for SGD 14.1 -- 29 June (In-person with live stream)
        16:00-17:15 UTC +1 
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
