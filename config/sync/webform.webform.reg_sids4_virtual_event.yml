id: reg_sids4_virtual_event
title: 'REGISTRATION: SIDS4 Conference virtual side event by UNDP OIC'
description: 'Form where interested parties can register to receive announcements related to Call 4.'
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |-
      <div class="container-fluid" data-bootstrap-contains="containers">
      <div class="container">
      <div class="row">
      <div class="col-12">
      <p><img alt="SIDS4 conference UNDP virtual side event" data-entity-type="file" data-entity-uuid="1eba9c72-30d2-40ff-80e7-234f8fe84479" src="/sites/default/files/inline-images/event-sids4-oic.jpg" /></p>

      <p>&nbsp;</p>

      <p><b>Please fill in the short form below to register.</b></p>

      <p>Register for the virtual side event below to receive the connection details and stay informed about the UNDP Ocean Innovation Challenge's exciting <a href="https://oceaninnovationchallenge.org/library/events/undp-sids4-powering-sustainable-blue-economy-sids">SIDS4 Conference virtual side event</a>.</p>
      </div>
      </div>
      </div>
      </div>
      <script src="//cdn.public.n1ed.com/N1D8N1ED/widgets.js"></script>
    '#format': ckeditor
  e_mail_register:
    '#type': email
    '#title': 'E-mail *'
    '#required': true
  title_mr_ms_dr_prof_etc_:
    '#type': textfield
    '#title': 'Title (Mr. / Ms. / Dr. / Prof., etc.)'
  first_name_:
    '#type': textfield
    '#title': 'First Name *'
    '#required': true
  full_name_register:
    '#type': textfield
    '#title': 'Last Name *'
    '#required': true
  position_:
    '#type': textfield
    '#title': 'Job Title'
  organization_register:
    '#type': textfield
    '#title': 'Organization *'
  type_of_organization_such_as_ngo_startup_sme_etc_:
    '#type': textfield
    '#title': 'Type of organization (such as NGO, Startup, SME, etc.)'
  country:
    '#type': textfield
    '#title': 'Country*'
    '#required': true
  processed_text_02:
    '#type': processed_text
    '#text': |
      <p>*<em>Required information</em></p>
    '#format': ckeditor
  processed_text_03:
    '#type': processed_text
    '#text': |
      <p>&nbsp;</p>

      <p>By registering, you agree to receive emails from the UNDP Ocean Innovation Challenge with the virtual event link and important updates on the event.&nbsp;</p>

      <p>To receive further information about the UNDP Ocean Innovation Challenge and the innovators, subscribe to our quarterly updates. Please indicate below.</p>
    '#format': ckeditor
  please_select_your_option_s_:
    '#type': checkboxes
    '#title': 'Opt in to the newsletter'
    '#options':
      'Please subscribe me to the UNDP OIC Updates': 'Please subscribe me to the UNDP OIC Updates'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
