      body: "<p>Dear&nbsp;[webform_submission:values:first_name_],<br />\r\n<br />\r\nThank you for registering for the UNDP Ocean Innovation Challenge&#39;s&nbsp;<a href=\"https://oceaninnovationchallenge.org/library/events/undp-sids4-powering-sustainable-blue-economy-sids\" tabindex=\"-1\">SIDS4 Conference virtual side event</a>.&nbsp;We&#39;re excited to have you join us.<br />\r\n<br />\r\nYou&#39;ll receive connection details and any important updates shortly. To ensure you receive our emails, please add this address to your safe senders list.<br />\r\n<br />\r\nWe look forward to seeing you virtually.</p>\r\n\r\n<p>Best regards,<br />\r\nUNDP OIC Secretariat</p>\r\n\r\n<h5>Visit <strong><a href=\"https://oceaninnovationchallenge.org\">https://oceaninnovationchallenge.org</a></strong>&nbsp;and follow us at <a href=\"https://twitter.com/UNDPOceanInnov\">Twitter</a>&nbsp; <a href=\"https://www.facebook.com/OceanActionHub\">Facebook</a>&nbsp;&nbsp;and&nbsp; <a href=\"https://www.linkedin.com/in/ocean-innovation-challenge-371782199/\">LinkedIn</a>&nbsp;to know more about the&nbsp;Ocean Innovation Challenge&nbsp;(OIC) and the ocean innovators.</h5>"
