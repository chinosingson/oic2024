id: contact_us
title: 'Contact Us'
description: ''
categories: {  }
elements: |-
  contact_us_main_text:
    '#type': processed_text
    '#text': |
      <p style="margin-bottom:11px"><span style="line-height:108%"><span lang="en-US">Dr. Mary M. Matthews, Ph.D.<br />
      Ocean Advisor &amp; Ocean Innovation Challenge Manager<br />
      UNDP Water and Ocean Governance Programme</span></span></p>

      <p style="margin-bottom:11px"><span style="line-height:108%"><span lang="en-US"><b>For outreach and media inquiries:</b></span><br />
      <span lang="en-US">Khristine Custodio Gudczinski<br />
      Communication and Promotion Expert</span></span></p>

      <p style="margin-bottom:11px"><span style="line-height:108%"><span lang="en-US"><b>For innovator and project management:</b></span><br />
      <span lang="en-US">Ahmed A. Elseoud<br />
      Management Mentor</span></span></p>

      <p style="margin-bottom:11px"><span style="line-height:108%"><span lang="en-US"><b>For operational inquiries:</b></span><br />
      <span lang="en-US">Lana Manjgaladze<br />
      Project Management Officer</span></span></p>
    '#format': ckeditor
  contact_us_message_us:
    '#type': webform_section
    '#title': 'MESSAGE US'
    name:
      '#type': webform_name
      '#title': 'Your Name'
      '#title_display': before
      '#required': true
      '#title__access': false
      '#first__required': true
      '#middle__access': false
      '#last__required': true
      '#suffix__access': false
      '#degree__access': false
    organization:
      '#type': textfield
      '#title': Organization
      '#required': true
    position_title:
      '#type': textfield
      '#title': Position/Title
    email:
      '#type': email
      '#title': Email
      '#required': true
    contact_us_topic:
      '#type': select
      '#title': Topic
      '#options':
        'General Question': 'General Question'
        'Outreach and media': 'Outreach and media'
        'Partnership opportunities': 'Partnership opportunities'
        'OIC management': 'OIC management'
        'Operational inquiries': 'Operational inquiries'
      '#required': true
    message:
      '#type': textarea
      '#title': Message
      '#title_display': before
      '#required': true
    captcha:
      '#type': captcha
      '#captcha_type': captcha/Math
