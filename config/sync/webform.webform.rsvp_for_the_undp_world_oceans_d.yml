id: rsvp_for_the_undp_world_oceans_d
title: 'RSVP for the UNDP High-level World Oceans Day 2021 Celebration - Ocean Innovators'
description: "Form where invited participants can confirm their participation for the 8 June high-level event.<br />\r\nThis form will be submitted to Intrado for sending of the event link."
categories: {  }
elements: |-
  note_register:
    '#type': processed_text
    '#text': |
      <p>To register for the UNDP high-level World Oceans Day celebration, please provide the following details below.</p>

      <p>Kindly take note that your details will only be used for the purpose of this event unless otherwise indicated.</p>
      <!--<p>Please provide the following details to proceed with the application. After clicking SUBMIT, you will receive an email with the link to the online application form.</p>-->
    '#format': full_html
  e_mail_register:
    '#type': email
    '#title': 'E-mail *'
    '#required': true
  title_mr_ms_dr_prof_etc_:
    '#type': textfield
    '#title': 'Title (Mr. / Ms. / Dr. / Prof., etc.)'
  first_name_:
    '#type': textfield
    '#title': 'First Name *'
    '#required': true
  full_name_register:
    '#type': textfield
    '#title': 'Last Name *'
    '#required': true
  organization_register:
    '#type': textfield
    '#title': 'Organization *'
    '#required': true
  position_:
    '#type': textfield
    '#title': 'Position *'
    '#required': true
  please_select_your_preferred_language_for_the_event_:
    '#type': label
    '#title': 'Please select your preferred language for the event:'
  select_event_language:
    '#type': checkboxes
    '#title': 'Please select your preferred language for the event:'
    '#multiple': 2
    '#description': 'English is the main language of the event. We are considering offering simultaneous translation in French and Spanish. If you prefer translation, please indicate the language:'
    '#description_display': before
    '#options':
      French: French
      Spanish: Spanish
    '#options_display': side_by_side
  do_you_want_to_know_more_about_the_undp_ocean_innovation_challen:
    '#type': checkbox
    '#title': 'I am interested to know more about the UNDP Ocean Innovation Challenge.'
    '#description': 'Please provide me further information about the UNDP OIC, its activities, and any opportunities.&nbsp;'
    '#title_display': before
    '#prepopulate': true
    '#icheck': minimal-grey
    '#default_value': true
